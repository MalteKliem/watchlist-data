  for(i=1;i<=n;i++) noise.push(noise[i-1]+(r()-.5)*amp);
  var out=[];
  for(i=0;i<=n;i++) out.push(prev+(s.price-prev)*i/n+(noise[i]-noise[n]*i/n));
  return {v:out, prev:prev};
}

/* ---- Echte Verlaufsdaten (Yahoo Finance), sonst gezeichneter Beispielverlauf ---- */
function realSeries(s,r){
  if(r==="1D"){
    var c=CH1&&CH1[s.id]; if(!c||!c.c||!c.c.length) return null;
    var n=Math.max(1,Math.round((c.b-c.a)/c.step)), slots={}, first=-1, last=-1, i, v=[], cur;
    c.t.forEach(function(t,k){ var j=Math.round((t-c.a)/c.step); if(j>=0&&j<=n){ slots[j]=c.c[k]; if(first<0||j<first) first=j; if(j>last) last=j; } });
    if(last<0) return null;
    cur=slots[first]; for(i=0;i<=last;i++){ if(slots[i]!=null) cur=slots[i]; v.push(cur); }
    return {v:v,prev:c.pc||v[0],den:n,t0:c.a,step:c.step,real:true};
  }
  var h=CHH&&CHH[s.id]&&CHH[s.id][r]; if(!h||!h.c||h.c.length<2) return null;
  return {v:h.c,prev:h.c[0],t:h.t,den:h.c.length-1,days:Math.max(1,(h.t[h.t.length-1]-h.t[0])/86400),real:true};
}
function day1(s){ return realSeries(s,"1D")||day1syn(s); }
function rangeSeries(s,r){ return realSeries(s,r)||rangeSyn(s,r); }
function sessionFrac(s){
  try{
    if(!isOpen(s)) return 1;
    var parts=new Intl.DateTimeFormat("en-GB",{timeZone:s.tz,hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date()), o={};
    parts.forEach(function(p){o[p.type]=p.value;});
    var m=(+o.hour%24)*60+ +o.minute, h=HOURS[s.tz]||[540,1020];
    return Math.max(0.04,Math.min(1,(m-h[0])/(h[1]-h[0])));
  }catch(e){ return 1; }
}
function day1syn(s){ var k=Math.max(2,Math.round(64*sessionFrac(s))), d=series(s,k); d.den=64; return d; }
function rangeSyn(s,r){
  var now=new Date(), jan=new Date(now.getFullYear(),0,1), ytd=Math.max(2,Math.round((now-jan)/86400000));
  var yrs=Number.isFinite(+s.ipo)?Math.max(1,now.getFullYear()-s.ipo):10;
  var C={"1W":{n:35,days:7,tot:.03,amp:.006},"1M":{n:44,days:30,tot:.08,amp:.012},"YTD":{n:Math.max(20,Math.round(ytd*.7)),days:ytd,tot:.15,amp:.016},"1J":{n:120,days:365,tot:.25,amp:.03},"Max":{n:150,days:yrs*365,tot:1.2,amp:.05}}[r];
  var g=rng(hash(s.id+"|"+r)), tot=(g()-.35)*2*C.tot, start=s.price/(1+tot), noise=[0], i;
  for(i=1;i<=C.n;i++) noise.push(noise[i-1]+(g()-.5)*s.price*C.amp);
  var out=[]; for(i=0;i<=C.n;i++) out.push(Math.max(s.price*0.05,start+(s.price-start)*i/C.n+(noise[i]-noise[C.n]*i/C.n)));
  out[0]=Math.max(s.price*0.05,start); out[C.n]=s.price;
  return {v:out, prev:out[0], days:C.days, den:C.n};
}
function path(v,w,h,pad,lo,hi,den){
  den=den||(v.length-1);
  return v.map(function(y,i){ var X=(w*i/den).toFixed(1), Y=(pad+(h-2*pad)*(1-(y-lo)/(hi-lo))).toFixed(1); return (i?"L":"M")+X+" "+Y; }).join(" ");
}
function spark(s){
  if(!hasData(s)) return '<span class="spark nodata" aria-hidden="true"></span>';
  var rs=realSeries(s,"1D"), d=series(s,32); if(rs){ var st=Math.max(1,Math.ceil(rs.v.length/40)), vv=rs.v.filter(function(x,i){return i%st===0||i===rs.v.length-1;}); d={v:vv,prev:rs.prev}; if(d.v.length<2) d={v:[rs.prev,rs.v[0]],prev:rs.prev}; } var lo=Math.min.apply(null,d.v.concat(d.prev)), hi=Math.max.apply(null,d.v.concat(d.prev));
  var cls=d.v[d.v.length-1]>=d.prev?"up-c":"down-c";

}

/* ---- Geräte-Abgleich: Beträge, Notizen, Favoriten und eigene Aktien liegen als private Datei in deinem GitHub-Repository ----

var SYNC={repo:"MalteKliem/watchlist",path:"data/profile.json",tok:null,ts:{},last:{},sha:null,busy:false,again:false,timer:null,at:0,err:null,tries:0};

/* Besitzer-Version: Geräte-Abgleich sichtbar, wenn ein Schlüssel gespeichert ist oder die Seite einmal mit ?owner=1 geöffnet wurde. Alle anderen sehen die Freunde-Version. */

try{ var _ts=JSON.parse(localStorage.getItem("wl-sync-ts")||"null"); if(_ts&&typeof _ts==="object") SYNC.ts=_ts; }catch(e){}
function syncFlat(){
  var f={}, k;
  for(k in inv) if(Number.isFinite(inv[k])) f["inv:"+k]=inv[k];
  for(k in notes) if(typeof notes[k]==="string"&&notes[k]!=="") f["note:"+k]=notes[k];
  state.stars.forEach(function(id){ f["star:"+id]=true; });
  state.watch.forEach(function(id){ f["watch:"+id]=true; });
  state.wish.forEach(function(id){ f["wish:"+id]=true; });
  customList().forEach(function(c){ f["custom:"+c.id]=c; });

}
function syncPersist(){ try{ localStorage.setItem("wl-sync-ts",JSON.stringify(SYNC.ts)); }catch(e){} }
function syncStamp(){
  var cur=syncFlat(), now=Date.now(), k;
  for(k in cur) if(JSON.stringify(cur[k])!==JSON.stringify(SYNC.last[k])) SYNC.ts[k]=now;
  for(k in SYNC.last) if(!(k in cur)) SYNC.ts[k]=now;
  SYNC.last=cur; syncPersist();
}
function syncTouch(){
  syncStamp();

}
function syncMerge(remote){
  var cur=syncFlat(), keys={}, out={}, k;
  for(k in cur) keys[k]=1; for(k in SYNC.ts) keys[k]=1; for(k in remote) keys[k]=1;
  for(k in keys){
    var r=remote[k], lt=SYNC.ts[k]||0, touched=(k in SYNC.ts);
    if(r&&((r.t||0)>lt||!touched)) out[k]={v:(r.v===undefined?null:r.v),t:r.t||0};
    else out[k]={v:(k in cur)?cur[k]:null,t:lt};
  }
  return out;
}
function syncApply(out){
  var before=JSON.stringify(syncFlat()), ni={}, nn={}, ns=[], nc=[], nw=[], nh=[], k, old=state.stars;
  for(k in out){ var it=out[k]; SYNC.ts[k]=it.t||0; if(it.v===null) continue;
    var i=k.indexOf(":"), kind=k.slice(0,i), id=k.slice(i+1);
    if(kind==="inv"&&Number.isFinite(it.v)) ni[id]=it.v;
    else if(kind==="note"&&typeof it.v==="string") nn[id]=it.v;
    else if(kind==="star") ns.push(id);
    else if(kind==="watch") nw.push(id);
    else if(kind==="wish") nh.push(id);
    else if(kind==="custom"&&it.v&&it.v.id) nc.push(it.v);
  }
  inv=ni; notes=nn;
  state.stars=old.filter(function(x){return ns.indexOf(x)>=0;}).concat(ns.filter(function(x){return old.indexOf(x)<0;}));
  state.watch=nw; state.wish=nh;
  applyCustom(nc);
  SYNC.last=syncFlat(); syncPersist();
  try{ localStorage.setItem("wl-invest",JSON.stringify(inv)); localStorage.setItem("wl-notes",JSON.stringify(notes)); localStorage.setItem("wl-custom",JSON.stringify(customList())); localStorage.setItem("wl-stars",JSON.stringify(state.stars)); localStorage.setItem("wl-watch",JSON.stringify(state.watch)); localStorage.setItem("wl-wish",JSON.stringify(state.wish)); }catch(e){}

function b64e(t){ return btoa(unescape(encodeURIComponent(t))); }

function ghCall(method,body){

  var o={method:method,cache:"no-store",headers:{"Authorization":"Bearer "+SYNC.tok,"Accept":"application/vnd.github+json"}};
  if(body){ o.body=JSON.stringify(body); o.headers["Content-Type"]="application/json"; }

    if(r.status===401||r.status===403) throw {code:"auth"};
    if(r.status===409||r.status===422) throw {code:"conflict"};

document.addEventListener("toggle",function(e){ var d=e.target; if(d&&d.dataset&&d.dataset.det){ if(d.dataset.det==="add") state.addOpen=d.open; else if(d.dataset.det==="backup") state.bkOpen=d.open; else if(d.dataset.det==="sync") state.syncOpen=d.open; else if(d.dataset.det==="fb"){ var wasFb=state.fbOpen; state.fbOpen=d.open; if(d.open&&!wasFb) { jumpBottom(); requestAnimationFrame(jumpBottom); } } else state.statusOpen=d.open; } },true);
document.addEventListener("click",function(e){ if((state.menu||state.curMenu||state.modeMenu)&&!e.target.closest(".dd")){ state.menu=false; state.curMenu=false; state.modeMenu=false; draw(); } });
document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&(state.menu||state.curMenu||state.modeMenu)){ state.menu=false; state.curMenu=false; state.modeMenu=false; draw(); } });
window.addEventListener("hashchange",function(){
  var id=location.hash.slice(1), ok=STOCKS.some(function(x){return x.id===id;});
  if(ok&&state.id!==id){ if(state.view==="list") state.listY=window.scrollY; state.view="detail"; state.id=id; draw(); } else if(!id&&state.view==="detail"){ state.view="list"; state.id=null; draw(); window.scrollTo(0,state.listY||0); }
});
document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&state.fbDoc){ state.fbDoc=false; state.fbWinMsg=null; draw(); } });
setInterval(function(){ var a=document.activeElement; if(!state.fbDoc&&!state.divCal&&!state.holCal&&!state.menu&&!state.modeMenu&&!state.hover&&(!a||a===document.body||!app.contains(a))) draw(); },30000);
(function init(){
  var id=""; try{ id=location.hash.slice(1); }catch(e){}
  if(STOCKS.some(function(x){return x.id===id;})){ state.view="detail"; state.id=id; }
  draw(); loadLive(); loadCharts(); loadQuarters(); loadDividends(); loadPe(); loadNews(); setInterval(function(){ loadLive(); loadCharts(); },600000);
})();
</script>

</body></html>
