<title>Watchlist Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: eine Wertpapierliste als Startseite, Klick öffnet eine Detailseite mit Kennzahlen-Blöcken. Zahlen in Mono, Text in Sans. */
:root{
  --bg:#000000; --surface:#0C0F0E; --ink:#E8EEEB; --muted:#8E9C96; --line:#222B27;
  --accent:#86AEE8; --accent-soft:#16233A;
  --up:#00E676; --up-bg:#07301C; --down:#FF4B4B; --down-bg:#3D0F0F; --warn:#FFA726; --warn-bg:#2E2209;
  color-scheme:dark;
  --spark-up:#00B96F; --curve-up:#00AB66; --curve-down:#E32B31;
  --pill-up:#00C471; --pill-down:#FF2B2B;
  --age-ok:#4B9A6E; --age-mid:#A98146; --age-bad:#AA504A;
  --price:#BCC5C1;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1040px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
/* BREITE (nur Browser): zum Rückgängigmachen diese Zeile löschen, dann gilt wieder 1040px */
@media (min-width:761px){.wrap{max-width:1400px}
  .top{margin-bottom:14px}
  .rowlink{grid-template-columns:minmax(0,1.38fr) minmax(0,1fr) 112px 104px 92px minmax(0,1.3fr)}
  .rowlink .meta{padding-left:28px}}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:1.6rem;letter-spacing:-.01em}
h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
a{color:inherit;text-decoration:none}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
.top .clock{font-size:.85rem;color:#B6C1BC}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:10px 12px;font-size:.88rem}

.tools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.88rem}
.chip[aria-pressed="true"]{background:#323B37;border-color:#4C5853;color:var(--ink)}
select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;max-width:100%}
.tools .count{margin-left:auto;font-size:.85rem;color:var(--muted)}
.dd{position:relative;width:13rem;max-width:100%}
.ddbtn{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;color:var(--ink)}
.ddbtn:hover{background:#232A27}
.ddlist{position:absolute;z-index:10;left:0;top:calc(100% + 4px);width:100%;max-height:60vh;overflow:auto;margin:0;padding:4px;list-style:none;background:#121716;border:1px solid #3A4440;border-radius:8px}
.ddlist button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:5px;padding:7px 10px;color:var(--ink);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ddlist button:hover,.ddlist button[aria-selected="true"]{background:#323B37;color:var(--ink)}
.favbox{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:4px 2px;cursor:pointer;color:#A3B0AA}
.favbox .box svg{width:14px;height:14px;display:block}
.favbox .box{width:20px;height:20px;border:1px solid #4C5853;border-radius:4px;background:#000;color:transparent;display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;line-height:1}
.favbox[aria-checked="true"] .box{background:#4A5550;border-color:#4A5550;color:#C2CBC7}
.spark.up-c{color:var(--spark-up)}

.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.list>li{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:stretch;border-top:1px solid var(--line)}
.list>li:first-child{border-top:0}
.star{background:none;border:0;cursor:pointer;font-size:1.15rem;color:var(--muted);padding:0}
.star[aria-pressed="true"]{color:#FFFFFF}
.rowlink{display:grid;gap:2px 12px;padding:12px 14px 12px 0;align-items:center;
  grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 112px 104px 92px minmax(0,1.3fr);
  grid-template-areas:"name sector spark price chg meta"}
.rowlink:hover .nm b{text-decoration:underline}
li.zero .rowlink,li.zero .rowlink *,li.zero .meta .age{color:#4C5752}
li.zero .nm b{color:#68736E}
li.zero .pill.up{background:#0A1710;color:#183627}
li.zero .pill.down{background:#1C0D0D;color:#3F1F1F}
li.zero .spark.up-c{color:#183627}
li.zero .spark.down-c{color:#3F1F1F}
li.zero .spark *{color:inherit}
.nm{grid-area:name;min-width:0}
.nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:1.15rem}
.nm small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:.8rem}
.foot .age{font-weight:500}
.foot .age.ok{color:var(--age-ok)}
.foot .age.mid{color:var(--age-mid)}
.foot .age.bad{color:var(--age-bad)}
.sec{grid-area:sector;color:var(--muted);font-size:.88rem;min-width:0}
.spark{grid-area:spark;width:112px;height:34px}
.px{grid-area:price;text-align:right;font-size:.88rem;color:var(--price)}
.chg{grid-area:chg;justify-self:end}
.meta{grid-area:meta;font-size:.78rem;color:var(--muted);min-width:0}
.meta .age{font-weight:500}
.meta .age.ok{color:var(--age-ok)}
.meta .age.mid{color:var(--age-mid)}
.meta .age.bad{color:var(--age-bad)}
.pill{display:inline-block;border-radius:5px;padding:2px 8px;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.9rem;white-space:nowrap}
.pill.up{background:var(--up-bg);color:var(--pill-up)}
.pill.down{background:var(--down-bg);color:var(--pill-down)}
.tag{display:inline-block;font-size:.72rem;border-radius:4px;padding:1px 6px;background:#2A302E;color:#A9B2AE}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.push{background:#12305E;color:#A9C7F5}
.tag.grey{background:#2A302E;color:#A9B2AE}
.sp{fill:none;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.up-c{color:var(--up)} .down-c{color:var(--down)}
svg.up-c{color:var(--curve-up)} svg.down-c{color:var(--curve-down)}

@media (max-width:760px){
  .rowlink{grid-template-columns:minmax(0,1fr) auto;
    grid-template-areas:"name price" "sector chg" "meta meta"}
  .spark{display:none}
  .px{font-size:.92rem}
}

.status summary{cursor:pointer;color:var(--muted);font-size:.88rem}
.status table{margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:6px 10px 6px 0;border-top:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);width:42%}
.scroll{overflow-x:auto}

/* Detailansicht */
.back{align-self:flex-start;background:none;border:0;color:#FFFFFF;cursor:pointer;padding:4px 0;font-size:.92rem}
.dhead{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;align-items:flex-end}
.dhead .id{display:flex;flex-direction:column;gap:2px;min-width:0}
.dhead .id span{color:var(--muted);font-size:.88rem}
.big{color:#CDD5D1;font-size:1.4rem;line-height:1.1;font-family:var(--mono);font-variant-numeric:tabular-nums}
.dright{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.hlrow{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px}
.hl .two{display:inline-grid}.hl .two>span{grid-area:1/1;text-align:center;white-space:nowrap}.hl .two>.x{visibility:hidden}
.hl .cyc{width:1em;height:1em;vertical-align:-.14em;margin-right:.1em}
@media (max-width:480px){.hlrow{gap:6px 6px;flex-wrap:nowrap}.hlrow .hl{padding:5px 8px;font-size:min(.88rem,3.15vw);flex:1 1 auto}}
@media (max-width:340px){.hlrow{flex-wrap:wrap}}
.hl{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:.88rem}
.hl[aria-pressed="true"]{background:#323B37;border-color:#4C5853;color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round}
.chart .ar{opacity:.12}
.range{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;margin-top:-10px;font-size:.8rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.news-cols{display:grid;grid-template-columns:minmax(0,1fr);gap:2px 40px}
@media (min-width:620px){
  .grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .news-panel{grid-column:span 2}
  .news-cols{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (min-width:920px){ .grid2{grid-template-columns:repeat(3,minmax(0,1fr))} }
.news{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.news li{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:1px solid var(--line)}
.news li:first-child{border-top:0;padding-top:0}
.news .src{font-size:.78rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.next{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.next b{font-size:1.15rem;font-weight:600}
.foot{font-size:.8rem;color:var(--muted)}
.pill.lg{font-size:1.05rem;padding:4px 12px}
.dhead h1{font-size:1.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dhead .id{flex:1 1 0;min-width:0}
.backbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:-16px;padding:12px 16px;border-bottom:1px solid var(--line)}
.chartwrap{position:relative}
.footrow{display:flex;justify-content:space-between;align-items:flex-end;gap:8px 16px;flex-wrap:wrap}
.inv{display:inline-flex;align-items:center;gap:8px;margin-left:auto}
.inv .amt{min-width:5.5rem;text-align:right;background:#0A0D0C;border:1px solid var(--line);border-radius:6px;padding:5px 10px;color:var(--ink);font-size:.95rem;line-height:1.2}
.inv .eur{color:var(--muted);font-size:.95rem}
.inv .invl{color:var(--muted);font-size:.9rem}
.h2c{font-size:.84rem}
.rhead{display:flex;align-items:center;gap:10px 48px;flex-wrap:wrap}
.logbox{color:var(--muted);margin-left:auto;padding:4px 0}
.ranges{display:flex;gap:30px;flex-wrap:nowrap}
.rg{background:none;border:0;padding:6px 0;cursor:pointer;font-size:.84rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rg[aria-pressed="true"]{color:var(--ink)}
.rg:hover{color:var(--ink)}
@media (max-width:760px){.rhead{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"t l" "r r";align-items:center;gap:2px 12px}.rhead .h2c{grid-area:t}.rhead .logbox{grid-area:l;margin-left:0}.rhead .ranges{grid-area:r;justify-content:space-between;gap:0}.rg{font-size:.8rem}}
.step{display:flex;flex-direction:column;width:30px;height:34px;border:1px solid #3A4440;border-radius:6px;overflow:hidden}
.step button{flex:1;display:flex;align-items:center;justify-content:center;background:#0A0D0C;border:0;color:var(--ink);cursor:pointer;padding:0;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.step button+button{border-top:1px solid #3A4440}
.step button:hover{background:#1A201E}
.step svg{width:10px;height:6px;display:block}

/* Nur Handy-Ansicht */
@media (max-width:760px){
  .chg{transform:translateY(-4px)}
  .dhead{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name price" "tick tick";gap:4px 8px;align-items:baseline;justify-content:stretch}
  .dhead .id,.dhead .dright{display:contents}
  .dhead h1{grid-area:name}
  .dhead .id>span{grid-area:tick}
  .dhead h1{min-width:0}
  .dhead .big{grid-area:price;justify-self:end;font-size:1.1rem}
  .dhead .id>span{justify-self:start;max-width:calc(100% - 130px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dhead .pill.lg{grid-area:tick;justify-self:end;font-size:.82rem;padding:3px 7px}
  .h2c{font-size:.8rem}
  .inv{width:100%}
  .inv .invl{margin-right:auto}
}
.chart{touch-action:pan-y;cursor:crosshair}
.chart .xh{stroke:#8E9C96;stroke-width:1;stroke-dasharray:1 3;vector-effect:non-scaling-stroke}
.chart .dot{stroke:var(--bg);stroke-width:2}
.tip{position:absolute;pointer-events:none;z-index:5;background:#161C1A;border:1px solid #3A4440;border-radius:6px;padding:6px 10px;font-size:.8rem;line-height:1.4;white-space:nowrap}
.nc.src{font-size:.78rem;color:var(--muted)}
.nl:hover{text-decoration:underline}
.nc.tagrow{display:flex;align-items:flex-start;margin-top:2px}
.nc.t.gap{padding-top:12px}
@media (min-width:620px){ .nc{grid-row:var(--r);grid-column:var(--c)} }
.nsep{display:none}
@media (max-width:619px){ .nc.t.rf{margin-top:14px} .nsep{display:block;height:1px;background:var(--line);margin:14px 14px 0} }
.p-u{order:1} .p-d{order:2} .p-q{order:3} .news-panel{order:4}
.hl-wrap{order:5;align-self:end;justify-self:end}
.tagrow{display:flex;margin-top:2px}

/* ---- Suche, Meldungen, Notizen, Aktie hinzufügen, Aktie wechseln ---- */
.search{position:relative;display:block;width:100%}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
.search input{width:100%;box-sizing:border-box;height:38px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px 0 34px;color:var(--ink);font:inherit;font-size:.88rem;line-height:normal}
.search input::placeholder{color:var(--muted)}
@media (min-width:761px){.search{width:auto;flex:0 1 520px;min-width:160px}}
.srow{display:flex;align-items:center;gap:12px}
.srow .search{flex:1 1 auto}
.total{display:inline-flex;align-items:center;gap:6px;box-sizing:border-box;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 14px;white-space:nowrap;font-size:.88rem;height:38px;color:var(--ink);min-width:0;overflow:hidden}
.total .tl{color:var(--muted)}
.tline{display:contents}
.total.t-mob{display:none;height:31px;padding:0 12px;flex:0 1 auto}
@media (min-width:761px){.srow .total{margin-left:auto;flex:none}}
@media (max-width:760px){.srow .total{display:none}.total.t-mob{display:inline-flex}.tools .total.t-mob{margin-right:auto}.tline{display:flex;align-items:center;gap:10px;width:100%}}
@media (max-width:760px){.search input{font-size:16px}}
.search input:focus,.notes-panel textarea:focus,.fld input:focus{outline:none;border-color:#FFFFFF}
.alert{display:flex;align-items:center;gap:12px;background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:10px 12px;font-size:.88rem}
.alert .at{flex:1;min-width:0}
.alert .ax{flex:none;background:none;border:0;color:var(--warn);font-size:1.5rem;line-height:1;cursor:pointer;padding:0 2px}
.stalemark{color:var(--warn);font-weight:700;margin-left:4px;font-size:1.35em;line-height:1}
li.zero .stalemark{color:var(--warn)}
.spark.nodata{display:block}
.pill.nd{background:#1A201E;color:var(--muted)}
.backbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{display:flex;align-items:center;gap:2px;font-size:.92rem;color:#FFFFFF;white-space:nowrap}
.swb{background:none;border:0;color:#FFFFFF;cursor:pointer;padding:4px 8px;font-size:.92rem}
.swb:disabled{opacity:.3;cursor:default}
.notes-panel{order:5}
.notes-panel textarea{flex:1;min-height:150px;resize:none;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;color:var(--ink);font:inherit;font-size:.92rem;line-height:1.45}
.notes-panel .ns{font-size:.78rem;color:var(--muted)}
@media (min-width:620px) and (max-width:919px){.notes-panel{grid-column:span 2}}
@media (max-width:760px){.notes-panel textarea{font-size:16px}}
.curdd{width:100%}
.curdd .ddlist{top:auto;bottom:calc(100% + 4px)}
.curdd .ddbtn{padding:7px 9px;font-size:.92rem;background:var(--bg)}
.curdd .ddbtn:hover{background:#232A27}
.addgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;margin-top:10px}
@media (max-width:620px){.addgrid{grid-template-columns:minmax(0,1fr)}}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
.fld input,.fld select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;color:var(--ink);font:inherit;font-size:.92rem;min-width:0}
@media (max-width:760px){.fld input,.fld select{font-size:16px}}
.addact{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.addmsg{font-size:.85rem;color:var(--muted)} .addmsg.err{color:var(--warn)}
.delrow{margin-top:-4px}
.delbtn{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.82rem;padding:4px 0;text-decoration:underline}
</style>

/* ---- Börsenfeiertage (Regeln statt Datenquelle; gilt für die Börsen, an denen die Aktien gehandelt werden) ---- */
var HCAL={"America/New_York":"NYSE","America/Toronto":"TSX","Europe/Amsterdam":"AMS","Europe/Stockholm":"STO","Asia/Tokyo":"JPX"}, HCACHE={};
function hIso(y,m,d){ return y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0"); }
function hUtc(y,m,d){ return new Date(Date.UTC(y,m-1,d)); }
function hAdd(dt,n){ return new Date(dt.getTime()+n*86400000); }
function hWd(y,m,d){ return hUtc(y,m,d).getUTCDay(); }
function hNth(y,m,wd,n){ var f=hWd(y,m,1); return 1+((wd-f+7)%7)+(n-1)*7; }
function hLast(y,m,wd){ var ld=new Date(Date.UTC(y,m,0)).getUTCDate(), l=hWd(y,m,ld); return ld-((l-wd+7)%7); }
function hEaster(y){
  var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,
      i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  return hUtc(y,mo,da);
}
function hBuild(cal,y){
  var H={}, E=hEaster(y);

      return dl.save({filename:fn,data:data}).then(function(){ state.bkMsg={text:"Sicherung gespeichert."}; draw(); },function(er){ state.bkMsg=(er&&er.code==="declined")?null:{err:true,text:"Die Sicherung konnte nicht gespeichert werden."}; draw(); });

      SYNC.tok=null; state.syncMsg={err:true,text:(er&&er.code==="auth")?"Der Schlüssel wurde abgelehnt. Er braucht Lese- und Schreibrecht (Contents) für das Repository watchlist.":"Verbindung zu GitHub fehlgeschlagen. Bitte später erneut versuchen."}; draw(); });
    return; }

  if(t.dataset.nav){

    var k=nr.map(function(x){return x.id;}).indexOf(state.id)+(+t.dataset.nav);

app.addEventListener("change",function(e){
  var el=e.target; if(!el||el.id!=="bkfile"||!el.files||!el.files[0]) return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var o=JSON.parse(rd.result);
      if(!o||o.format!=="watchlist-sicherung") throw new Error("format");
      state.bkPending=o; state.bkOpen=true;
      state.bkMsg={text:"Datei gelesen: "+Object.keys(o.invest||{}).length+" Beträge, "+Object.keys(o.notes||{}).length+" Notizen, "+(o.stars||[]).length+" Favoriten, "+(o.custom||[]).length+" selbst hinzugefügte Aktien. Zum Laden bitte bestätigen."};
    }catch(x){ state.bkPending=null; state.bkMsg={err:true,text:"Diese Datei ist keine gültige Sicherung."}; state.bkOpen=true; }
    draw();
  };
  rd.readAsText(el.files[0]);
});
app.addEventListener("input",function(e){
  var el=e.target;
  if(el.id==="q"){ state.q=el.value; draw(); }
  else if(el.id==="note"){ if(el.value) notes[state.id]=el.value; else delete notes[state.id]; save(); noteStat(); }
  else if(el.dataset&&el.dataset.f){ state.form[el.dataset.f]=el.value; }
});
app.addEventListener("submit",function(e){
  e.preventDefault();
  var F=state.form, name=(F.name||"").trim(), id=(F.id||"").trim().toUpperCase().replace(/[^A-Z0-9.\-]/g,"");
  if(!name||!id){ state.addMsg={err:true,text:"Bitte Name und Kürzel ausfüllen."}; state.addOpen=true; draw(); return; }
  if(STOCKS.some(function(s){return s.id===id;})){ state.addMsg={err:true,text:"Dieses Kürzel gibt es schon."}; state.addOpen=true; draw(); return; }
  var land=(F.land||"").trim(), ex=(F.ex||"").trim(), region=REGION_OF[land]||"Sonstige";
  STOCKS.push(mkCustom({id:id,name:name,ex:ex||"–",tz:exTz(ex),land:land||"–",region:region,sector:(F.sector||"").trim()||"–",grp:(F.grp||"").trim()||"Sonstige",cur:F.cur||"USD"}));
  save(); state.form={}; state.addMsg={text:"„"+name+"“ wurde hinzugefügt (Region: "+region+")."}; state.addOpen=true; draw();
});
document.addEventListener("toggle",function(e){ var d=e.target; if(d&&d.dataset&&d.dataset.det){ if(d.dataset.det==="add") state.addOpen=d.open; else if(d.dataset.det==="backup") state.bkOpen=d.open; else if(d.dataset.det==="sync") state.syncOpen=d.open; else state.statusOpen=d.open; } },true);

setInterval(function(){ var a=document.activeElement; if(!state.menu&&!state.hover&&(!a||a===document.body||!app.contains(a))) draw(); },30000);
